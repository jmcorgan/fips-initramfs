# Settings for the fips-initramfs package itself. The node's own
# configuration is in fips.yaml beside this file.

# Where to find the fips daemon and fipsctl.
#
# Left empty, the package looks in /usr/bin first, which is where the
# fips package puts them, and then in /usr/lib/fips-initramfs/bin, where
# this package installs its own copies from a published FIPS release.
#
# So a machine with the fips package uses the same build in the
# initramfs as it runs as a daemon, and a machine without it uses the
# copies this package carries. Neither needs anything done by hand.
#
# Set this only to override the search entirely. Both binaries must be
# in the directory named. A directory named here and found wanting is an
# error, not a reason to quietly use a different daemon.
#FIPS_BINDIR=

# Whether an SSH session into the initramfs is forced to run
# cryptroot-unlock.
#
# The default is yes. Dropbear then runs that command whatever the
# client asks for, so a session unlocks the disk and cannot open a
# shell. The rewrite is made on the copy of authorized_keys inside the
# generated image; the file in /etc/dropbear/initramfs is never touched.
#
# Set this to no while bringing a machine up, because a shell in the
# initramfs is how a failed unlock gets diagnosed. Run
# update-initramfs -u after changing it.
#
# A key line that already carries its own options is left alone either
# way, and update-initramfs says so.
#FIPS_FORCE_UNLOCK_COMMAND=yes
