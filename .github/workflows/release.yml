name: release

# Builds the package for a tag and attaches it to the release.
#
# The boot test is NOT here and cannot be: it needs a booted machine with
# an encrypted root reaching a live mesh, which no hosted runner provides.
# Run it by hand before marking a release latest.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      fips_tag:
        description: 'FIPS release tag to bundle, e.g. v0.5.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:13
      options: --user root
    steps:
      - name: install git
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git ca-certificates
      - uses: actions/checkout@v4

      # A release must pin the FIPS version it bundles. fetch-fips-deb.sh
      # takes the latest release by default and vendor/ is gitignored, so
      # without a pin two builds of one tag can carry different binaries
      # and nothing records which shipped.
      - name: check the FIPS tag is pinned
        run: |
          if [ -z "${{ inputs.fips_tag }}" ] && [ -z "$FIPS_TAG" ]; then
            echo "FIPS_TAG is not set. A release build must pin the FIPS" >&2
            echo "release it bundles; see debian/fetch-fips-deb.sh." >&2
            exit 1
          fi

      - name: build
        env:
          FIPS_TAG: ${{ inputs.fips_tag }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get install -y -qq build-essential debhelper dpkg-dev fakeroot \
              curl ca-certificates lintian
          dpkg-buildpackage -us -uc -b
          mkdir -p out && mv ../fips-initramfs_*.deb out/
          cd out && sha256sum ./*.deb > SHA256SUMS
          echo "bundled FIPS version: $(cat ../vendor/fips-version)"

      - name: record what was bundled
        run: |
          {
            echo "FIPS version bundled: $(cat vendor/fips-version)"
            echo
            cat out/SHA256SUMS
          } > out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fips-initramfs-deb
          path: out/
